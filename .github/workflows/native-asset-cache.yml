name: Native shader asset cache
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  android-cache-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.19'
          python-version: '3.12'
      - name: Install locked test dependencies
        run: |
          uv sync --locked --group dev
          mkdir -p artifacts/test-deps
          curl --fail --silent --show-error --location --retry 3 \
            https://repo.maven.apache.org/maven2/org/json/json/20240303/json-20240303.jar \
            --output artifacts/test-deps/json.jar
          printf '%s\n' '3cf6cd6892e32e2b4c1c39e0f52f5248a2f5b37646fdfbb79a66b46b618414ed  artifacts/test-deps/json.jar' | sha256sum --check -
      - name: Require real filesystem alias and cache integrity tests
        env:
          XRBENCH_REQUIRE_ASSET_TESTS: '1'
        run: >-
          uv run --locked --group dev python -m pytest -q
          engine/tests/test_native_asset_cache.py
          -k 'not published_apk_assets'
