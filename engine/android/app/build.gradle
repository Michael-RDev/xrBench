plugins { id 'com.android.application' }
android {
    namespace 'org.xrgpu.benchmarks'
    compileSdk 35
    buildToolsVersion '35.0.0'
    defaultConfig {
        applicationId 'org.xrgpu.benchmarks'
        minSdk 29
        targetSdk 32
        versionCode 1
        versionName '0.1.0'
        ndk { abiFilters 'arm64-v8a' }
    }
    signingConfigs { debug { storeFile rootProject.file('../.state/debug.keystore') } }
    sourceSets.main {
        assets.srcDirs = [rootProject.file('../.build/assets')]
        jniLibs.srcDirs = [rootProject.file('../.build/lib')]
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    packaging { jniLibs { useLegacyPackaging = true } }
    androidResources { noCompress 'pte', 'bin' }
}
