plugins { id 'com.android.application' }
def publicNative = project.findProperty('xrbenchPublicNative') == 'true'
android {
    namespace 'org.xrgpu.benchmarks'
    compileSdk 35
    buildToolsVersion '35.0.0'
    defaultConfig {
        buildConfigField 'boolean', 'PUBLIC_NATIVE', publicNative.toString()
        applicationId 'org.xrgpu.benchmarks'
        minSdk 29
        targetSdk 32
        versionCode 1
        versionName '0.1.0'
        ndk { abiFilters 'arm64-v8a' }
    }
    signingConfigs {
        debug { storeFile rootProject.file('../.state/debug.keystore') }
        web {
            def key = System.getenv('XRBENCH_WEB_KEYSTORE')
            if (key) storeFile file(key)
            storePassword System.getenv('XRBENCH_WEB_STORE_PASSWORD')
            keyAlias System.getenv('XRBENCH_WEB_KEY_ALIAS')
            keyPassword System.getenv('XRBENCH_WEB_KEY_PASSWORD')
        }
    }
    buildTypes {
        web {
            initWith debug
            def certificate = (System.getenv('XRBENCH_WEB_CERT_SHA256') ?: '').toLowerCase()
            applicationIdSuffix certificate ==~ /[a-f0-9]{64}/ ? '.web.s' + certificate : '.web'
            buildConfigField 'boolean', 'PUBLIC_NATIVE', 'true'
            // The browser uses authenticated ADB run-as for private commands/reports.
            debuggable true
            signingConfig signingConfigs.web
            matchingFallbacks = ['debug']
        }
    }
    buildFeatures { buildConfig true }
    sourceSets {
        main { assets.srcDirs = []; jniLibs.srcDirs = [] }
        debug {
            assets.srcDirs = [rootProject.file(publicNative ? '../.build/public-native/assets' : '../.build/assets')]
            jniLibs.srcDirs = [rootProject.file(publicNative ? '../.build/public-native/lib' : '../.build/lib')]
        }
        web {
            assets.srcDirs = [rootProject.file('../.build/public-native/assets')]
            jniLibs.srcDirs = [rootProject.file('../.build/public-native/lib')]
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    packaging { jniLibs { useLegacyPackaging = true } }
    androidResources { noCompress 'pte', 'bin' }
}
androidComponents {
    onVariants(selector().withBuildType('web')) { variant ->
        def code = (System.getenv('XRBENCH_WEB_VERSION_CODE') ?: '1').toInteger()
        variant.outputs.each { output ->
            output.versionCode.set(code)
            output.versionName.set('0.1.' + code)
        }
    }
}
