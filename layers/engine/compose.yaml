services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: xrgpu
      POSTGRES_DB: xrgpu
      POSTGRES_PASSWORD: "${XRGPU_DB_PASSWORD:?Run the benchmark launcher to initialize local configuration}"
    ports:
      - "127.0.0.1:${XRGPU_DB_PORT:-5432}:5432"
    volumes:
      - benchmark-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U xrgpu -d xrgpu"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped
volumes:
  benchmark-postgres:
